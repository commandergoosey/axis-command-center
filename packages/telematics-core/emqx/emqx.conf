# emqx.conf — EMQX 5 configuration for @axis/telematics-core
# HOCON format. Only MQTT-over-TLS with password auth is configured here;
# all other listeners (plain TCP 1883, WebSocket) are disabled.

# Disable plain TCP listener — devices must use TLS.
listeners.tcp.default.enable = false

# MQTT over TLS on 8883.
listeners.ssl.default {
  bind = "0.0.0.0:8883"
  ssl_options {
    cacertfile = "/opt/emqx/etc/certs/ca.pem"
    certfile   = "/opt/emqx/etc/certs/broker.pem"
    keyfile    = "/opt/emqx/etc/certs/broker.key"
    verify     = verify_none   # change to verify_peer for mutual TLS
  }
  max_connections = 5000
}

# Password-based authentication against EMQX's built-in database.
# Manage credentials via the dashboard or REST API after first boot.
authentication = [
  {
    mechanism    = password_based
    backend      = built_in_database
    user_id_type = username    # devices authenticate with IMEI as username
    password_hash_algorithm {
      name = bcrypt
    }
  }
]

# Authorisation — deny all topic access by default; allow devices to
# publish only to their own topic: devices/<username>/data
authorization {
  no_match = deny
  sources = [
    {
      type = built_in_database
    }
  ]
}

# Logging.
log.console {
  level = warning
  formatter = text
}

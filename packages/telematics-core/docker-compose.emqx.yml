version: '3.9'

# @axis/telematics-core — EMQX 5 MQTT broker
#
# ── Quick start ──────────────────────────────────────────────────────────────
#   docker compose -f docker-compose.emqx.yml up -d
#
# ── TLS setup ────────────────────────────────────────────────────────────────
#   Place three PEM files in ./certs/ before starting:
#     certs/ca.pem         — CA certificate (used by devices for trust)
#     certs/broker.pem     — broker TLS certificate (signed by CA)
#     certs/broker.key     — broker private key
#
#   To generate a self-signed CA + broker cert for development:
#     openssl genrsa -out certs/ca.key 4096
#     openssl req -x509 -new -nodes -key certs/ca.key -sha256 -days 3650 \
#             -out certs/ca.pem -subj "/CN=AXIS-Telematics-CA"
#     openssl genrsa -out certs/broker.key 2048
#     openssl req -new -key certs/broker.key -out certs/broker.csr \
#             -subj "/CN=<BROKER_HOST>"
#     openssl x509 -req -in certs/broker.csr -CA certs/ca.pem -CAkey certs/ca.key \
#             -CAcreateserial -out certs/broker.pem -days 3650 -sha256
#
# ── Password file (device authentication) ────────────────────────────────────
#   EMQX 5 uses a built-in database for password auth, managed via its REST API
#   or dashboard.  After provisioning a device via the @axis/telematics-core
#   API (POST /api/devices/:imei/provision), import the returned credentials:
#
#     curl -u admin:public -X POST \
#       http://localhost:18083/api/v5/authentication/<authn_id>/users \
#       -H "Content-Type: application/json" \
#       -d '{"user_id":"<imei>","password":"<plaintext_password>"}'
#
#   The <authn_id> appears in the EMQX dashboard under Authentication.
#   Devices authenticate with username=IMEI and the provisioned password.
#   The plaintext password is shown only once by the provision endpoint —
#   record it and import it before closing that response.
#
#   To deactivate a device, delete its user from the EMQX built-in database
#   and call PATCH /api/devices/:imei/deactivate in this module's API.
#
# ── Environment variables ─────────────────────────────────────────────────────
#   Set EMQX_DASHBOARD__DEFAULT_PASSWORD to a strong value before production.

services:
  emqx:
    image: emqx/emqx:5.6.0
    container_name: axis-emqx
    restart: unless-stopped
    ports:
      - "8883:8883"     # MQTT over TLS — devices connect here
      - "18083:18083"   # EMQX dashboard (restrict in production)
    environment:
      EMQX_NODE__NAME: "emqx@127.0.0.1"
      EMQX_LOG__CONSOLE__LEVEL: warning
      EMQX_DASHBOARD__DEFAULT_PASSWORD: "changeme-before-production"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_logs:/opt/emqx/log
      - ./emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./certs/ca.pem:/opt/emqx/etc/certs/ca.pem:ro
      - ./certs/broker.pem:/opt/emqx/etc/certs/broker.pem:ro
      - ./certs/broker.key:/opt/emqx/etc/certs/broker.key:ro
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  emqx_data:
  emqx_logs:
